# # --- Primary NTP servers (international, higher priority) ---
# server 0.pool.ntp.org iburst
# server 1.pool.ntp.org iburst
# server 2.pool.ntp.org iburst
# server 3.pool.ntp.org iburst

# --- Primary NTP servers (reliable global providers) ---
server time.windows.com iburst    # Microsoft
server time.apple.com iburst      # Apple
server time.google.com iburst     # Google

# --- Backup NTP servers (China, fallback) ---
server ntp.aliyun.com iburst
server ntp.tencent.com iburst
server ntp.ntsc.ac.cn iburst      # National Time Service Center, CAS
server cn.ntp.org.cn iburst


# Allow only time queries, at a limited rate, sending KoD when in excess.
# Allow all local queries (IPv4, IPv6)
restrict default nomodify nopeer noquery limited kod
restrict 127.0.0.1
restrict [::1]
